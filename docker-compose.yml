services:
  keyring-nginx:
    build: .
    image: keyring:latest
    container_name: keyring
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      keyring-auth:
        condition: service_healthy
    networks:
      - default
      - npm

  keyring-auth:
    build: ./auth
    image: keyring-auth:latest
    container_name: keyring-auth
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      KEYRING_CREDENTIAL: ${KEYRING_CREDENTIAL:?KEYRING_CREDENTIAL must be set in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/keyring/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - default

networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
