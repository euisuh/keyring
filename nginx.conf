# This file is included in nginx's http context (conf.d/), so map and
# limit_req_zone are valid here.

# script-src needs 'unsafe-inline' because Babel standalone executes the
# transpiled .jsx as inline scripts. The policy still blocks third-party
# script hosts other than unpkg, and connect-src/img-src 'self' limit where an
# injected script can send data with fetch or image beacons.
map "" $keyring_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'";
}

# Login brute-force throttle. Behind a reverse proxy without real_ip config,
# $binary_remote_addr is the proxy, so this becomes one shared bucket.
limit_req_zone $binary_remote_addr zone=keyring_auth:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Security headers applied via map so child location add_header blocks
    # do not silently drop them (nginx add_header inheritance pitfall).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $keyring_csp always;

    # Root redirects to credential gate
    location = / {
        return 302 /credential?service=otp;
    }

    # Keyring app
    location = /keyring {
        return 301 /keyring/$is_args$args;
    }

    location = /keyring/ {
        try_files /keyring/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy $keyring_csp always;
    }

    location = /keyring/api/auth {
        limit_req zone=keyring_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://keyring-auth:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth API — proxied to Flask service
    location ^~ /keyring/api/ {
        proxy_pass http://keyring-auth:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Credential gate
    location = /credential {
        try_files /credential/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy $keyring_csp always;
    }

    location = /credential/ {
        return 301 /credential$is_args$args;
    }

    # Static assets
    location / {
        try_files $uri =404;
    }

    location ~* \.(?:html)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy $keyring_csp always;
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|otf|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
